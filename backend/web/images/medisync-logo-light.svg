<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d6efd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00b4d8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon: Medical Cross + Sync -->
  <g transform="translate(90,100)">
    <!-- Medical Cross -->
    <rect x="-25" y="-45" width="50" height="90" rx="6" fill="url(#grad)"/>
    <rect x="-45" y="-25" width="90" height="50" rx="6" fill="url(#grad)"/>
    
    <!-- Sync circle -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="#0d6efd" stroke-width="3" opacity="0.5"/>
    <circle cx="0" cy="0" r="65" fill="none" stroke="#00b4d8" stroke-width="1.5" stroke-dasharray="10,5" opacity="0.4"/>
  </g>
  
  <!-- Text -->
  <text x="185" y="108" font-family="'Segoe UI', Arial, sans-serif" font-size="44" font-weight="bold" fill="#0d6efd" letter-spacing="2">
    Medi<tspan fill="#00b4d8">Sync</tspan>
  </text>
  <text x="185" y="135" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#6c757d" letter-spacing="6">
    HOSPITAL MANAGEMENT SYSTEM
  </text>
</svg>